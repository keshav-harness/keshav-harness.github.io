<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keshav Bathla</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Keshav Bathla</h1>
    <p class="subtitle">Runner. Builder. Tracking progress, one kilometre at a time.</p>

    <div class="stats">
      <div class="stat">
        <div class="stat-value">297 km</div>
        <div class="stat-label">Total Distance (2026)</div>
      </div>
      <div class="stat">
        <div class="stat-value">38</div>
        <div class="stat-label">Runs</div>
      </div>
      <div class="stat">
        <div class="stat-value">6:37</div>
        <div class="stat-label">Best Pace (min/km)</div>
      </div>
      <div class="stat">
        <div class="stat-value">15 km</div>
        <div class="stat-label">Longest Run</div>
      </div>
    </div>

    <h2>Sections</h2>
    <div class="card-grid">
      <a href="sports/" class="card">
        <h3>Sports</h3>
        <p>Running training plans, performance data, and analysis.</p>
      </a>
    </div>

    <div class="footer">
      <p>Keshav Bathla &middot; 2026</p>
    </div>
  </div>
</body>
</html>
