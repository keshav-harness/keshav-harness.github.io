<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Will you date me?</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="hearts-bg" id="heartsBg"></div>

<canvas id="confetti"></canvas>

<main class="stage" id="stage">
  <section class="card" id="askCard">
    <div class="bear">🐻</div>
    <h1>Komal, will you date me?</h1>
    <p class="sub">Take your time... but not too much time 👀</p>

    <div class="button-row" id="buttonRow">
      <button class="btn yes" id="yesBtn">Yes 💕</button>
      <button class="btn no" id="noBtn">No</button>
    </div>

    <p class="taunt" id="taunt"></p>
  </section>

  <section class="card celebrate" id="celebrateCard" hidden>
    <div class="bear bounce">🥰</div>
    <h1>Yay Komal!! It's a date 🎉</h1>
    <p class="sub">Best decision you've made all year.</p>
  </section>
</main>

<script src="script.js"></script>
</body>
</html>
